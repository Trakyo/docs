name: CI

# Every pull request: run the content checks, build the whole site, and check the
# Worker config. No secrets here (fork PRs included). The `build` job is required
# by the ruleset on main, so nothing merges that would fail to publish.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Checks first: a writer gets plain-words messages instead of a build error.
      - name: Fetch the live API spec
        run: node scripts/fetch-spec.mjs --strict

      - name: Content checks (error pages, Help Center rules, file sizes)
        run: node scripts/check.mjs

      - name: Build the site
        run: npm run build

      - name: Check the Worker config
        run: npx wrangler deploy --dry-run

  # The pull request's site with drafts shown, for its preview link. Only built
  # here: preview.yml (main's copy) publishes it after this workflow succeeds,
  # so the deploy token never runs next to code a pull request can change.
  # No preview for forks or Dependabot (see preview.yml).
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Show drafts
        run: node scripts/show-drafts.mjs

      - name: Build the site
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-site
          path: dist/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
